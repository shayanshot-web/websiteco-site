name: Check live site (read-only)

on:
  push:
    paths:
      - '.github/workflows/check-site.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe websiteco.ir
        env:
          S: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
        run: |
          B=https://websiteco.ir
          OUT=""
          add() { OUT="$OUT$1"$'\n'; }
          RND=$RANDOM$RANDOM
          for p in "/build.txt" "/build.txt?x=$RND" "/?x=$RND" "/" "/index.html?x=$RND" "/admin/?a=login&x=$RND"; do
            add "=== $p"
            add "$(curl -s -D - -o /tmp/body --max-time 25 "$B$p" | tr -d '\r' | grep -i -E '^(HTTP|server|last-modified|etag|age|x-litespeed|x-cache|cf-cache|cache-control|content-length)')"
            add "title: $(grep -o '<title>[^<]*</title>' /tmp/body | head -1)  body: $(head -c 90 /tmp/body | tr '\n' ' ')"
          done
          add "--- install.php: $(curl -s -o /dev/null -w '%{http_code}' --max-time 25 $B/install.php)"
          add "--- sitemap-cms: $(curl -s --max-time 25 $B/sitemap-cms.xml | head -c 120)"
          add "--- FTP public_html listing (-l) filtered:"
          sudo apt-get install -y lftp >/dev/null 2>&1
          add "$(lftp -u "$U","$P" "ftp://$S" -e "set ftp:ssl-force true; set ssl:verify-certificate false; cls -l /; cls -l /index.html /admin/index.php /cms-core/lib.php /uploads; quit" 2>&1 | tail -45)"
          OUT="${OUT//'%'/'%25'}"; OUT="${OUT//$'\r'/}"; OUT="${OUT//$'\n'/'%0A'}"
          echo "::notice title=SITE CHECK::${OUT}"
