name: Build and deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

# حداقل دسترسی برای توکن گیت‌هاب (این workflow فقط کد را می‌خواند)
permissions:
  contents: read

# دو دیپلوی هم‌زمان روی FTP نباید روی هم بنویسند
concurrency:
  group: deploy-cpanel
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # نسخهٔ دقیق وابستگی‌ها از package-lock.json (جلوگیری از ورود نسخهٔ آلوده در لحظهٔ بیلد)
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Write build marker
        run: echo "commit ${GITHUB_SHA} built at $(date -u +%Y-%m-%dT%H:%M:%SZ)" > out/build.txt
      - name: Upload to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: loose
          timeout: 120000
          log-level: standard
          local-dir: ./out/
          server-dir: ./
          # عکس‌های آپلودشده از پنل و دیتابیس هرگز لمس نمی‌شوند
          exclude: |
            **/.git*
            **/.git*/**
            uploads/**
            cms-data/**
            cms_data/**
