name: FTP login test (read-only)
on:
  push:
    branches: [ftp-test]
    paths: ['.github/workflows/ftp-test.yml']
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - env:
          S: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
        run: |
          # run-id: 1
          OUT="server-ip: $(getent hosts "$S" | awk '{print $1}' | head -1)  domain-ip: $(getent hosts websiteco.ir | awk '{print $1}' | head -1)"$'\n'
          OUT+="username-has-@: $([[ "$U" == *@* ]] && echo yes || echo NO)  user-len=${#U} pass-len=${#P} server-has-scheme: $([[ "$S" == *://* ]] && echo YES-BAD || echo no)"$'\n'
          OUT+="--- explicit FTPS: "$'\n'"$(curl -sS --ssl-reqd -k --max-time 20 -u "$U:$P" "ftp://$S/" 2>&1 | head -25)"$'\n'
          OUT+="--- plain FTP: "$'\n'"$(curl -sS --max-time 20 -u "$U:$P" "ftp://$S/" 2>&1 | head -25)"
          OUT="${OUT//'%'/'%25'}"; OUT="${OUT//$'\n'/'%0A'}"
          echo "::notice title=FTP TEST::${OUT}"
